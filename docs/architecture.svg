<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9534F"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#1F2328;text-anchor:middle}
      .s{font-size:12px;fill:#57606A;text-anchor:middle}
      .ln{stroke:#D9534F;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .pl{stroke:#D9534F;stroke-width:1.6;fill:none}
      .ml{font-size:13px;fill:#1F2328}
      .mv{font-size:13px;font-weight:700;fill:#1F2328;text-anchor:end}
    </style>
  </defs>
  <rect width="760" height="540" fill="#FFFFFF"/>
  <rect x="1" y="1" width="758" height="538" rx="10" fill="none" stroke="#D0D7DE"/>

  <!-- Raw Data -->
  <path d="M170,40 a70,12 0 0,1 140,0 v50 a70,12 0 0,1 -140,0 z" fill="#D5ECD4" stroke="#82B366" stroke-width="1.5"/>
  <ellipse cx="240" cy="40" rx="70" ry="12" fill="#E4F3E3" stroke="#82B366" stroke-width="1.5"/>
  <text class="t" x="240" y="75">Raw Data</text>
  <text class="s" x="240" y="93">18,634 emails</text>

  <path class="ln" d="M240,102 V128"/>

  <!-- Data Processing -->
  <path d="M122,158 L146,130 H334 L358,158 L334,186 H146 z" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
  <text class="t" x="240" y="155">Data Processing</text>
  <text class="s" x="240" y="173">Label encoding · Text cleaning</text>

  <path class="ln" d="M240,186 V212"/>

  <!-- Split -->
  <rect x="130" y="214" width="220" height="56" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <text class="t" x="240" y="238">Train / Valid / Test Split</text>
  <text class="s" x="240" y="257">70 / 15 / 15 · stratified</text>

  <!-- Feature Extraction group -->
  <rect x="60" y="298" width="360" height="104" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-dasharray="4 3"/>
  <text x="72" y="316" font-size="12" font-weight="700" fill="#57606A">Feature Extraction</text>
  <path class="ln" d="M205,270 V290 H145 V330"/>
  <path class="ln" d="M275,270 V290 H335 V330"/>
  <rect x="75" y="332" width="140" height="56" rx="6" fill="#FFFFFF" stroke="#9AA4AE"/>
  <text class="t" x="145" y="356" style="font-size:14px">Handcrafted</text>
  <text class="s" x="145" y="375">10 stats · raw text</text>
  <rect x="265" y="332" width="140" height="56" rx="6" fill="#FFFFFF" stroke="#9AA4AE"/>
  <text class="t" x="335" y="356" style="font-size:14px">TF-IDF</text>
  <text class="s" x="335" y="375">1,000 terms · fit on train</text>

  <path class="ln" d="M145,388 V414 H240 V432"/>
  <path class="pl" d="M335,388 V414 H240"/>
  <text x="248" y="428" font-size="11" fill="#57606A">concat</text>

  <!-- XGBoost -->
  <rect x="150" y="434" width="180" height="60" rx="6" fill="#F8CECC" stroke="#B85450" stroke-width="1.5"/>
  <text class="t" x="240" y="460" style="font-size:16px">XGBoost</text>
  <text class="s" x="240" y="479">train set · scale_pos_weight</text>

  <!-- connector to right column -->
  <path class="ln" d="M330,464 H450 V58 H474"/>

  <!-- Threshold Tuning -->
  <rect x="476" y="30" width="234" height="56" rx="6" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.5"/>
  <text class="t" x="593" y="54">Threshold Tuning</text>
  <text class="s" x="593" y="73">valid set · max MCC → 0.62</text>

  <path class="ln" d="M593,86 V110"/>

  <!-- Model Evaluation -->
  <ellipse cx="593" cy="136" rx="95" ry="24" fill="#F5F5F5" stroke="#8F8F8F" stroke-width="1.5"/>
  <text class="t" x="593" y="141">Model Evaluation</text>

  <path class="ln" d="M593,160 V184"/>

  <!-- Metrics -->
  <rect x="476" y="186" width="234" height="320" rx="6" fill="#FFFFFF" stroke="#9AA4AE"/>
  <text class="s" x="593" y="208" style="font-weight:700;fill:#1F2328">Test set · 2,796 emails</text>
  <line x1="490" y1="218" x2="696" y2="218" stroke="#D0D7DE"/>
  <text class="ml" x="492" y="244">Accuracy</text><text class="mv" x="694" y="244">95.14%</text>
  <text class="ml" x="492" y="272">Precision</text><text class="mv" x="694" y="272">93.09%</text>
  <text class="ml" x="492" y="300">Recall</text><text class="mv" x="694" y="300">94.62%</text>
  <text class="ml" x="492" y="328">F1-score</text><text class="mv" x="694" y="328">93.85%</text>
  <text class="ml" x="492" y="356">MCC</text><text class="mv" x="694" y="356">0.8984</text>
  <text class="ml" x="492" y="384">ROC-AUC</text><text class="mv" x="694" y="384">0.9902</text>
  <line x1="490" y1="400" x2="696" y2="400" stroke="#D0D7DE"/>
  <text class="s" x="593" y="424">Classification report</text>
  <text class="s" x="593" y="446">Confusion matrix</text>
  <text class="s" x="593" y="468">ROC curve · PR curve</text>
  <text class="s" x="593" y="490">Feature importance (gain)</text>
</svg>
